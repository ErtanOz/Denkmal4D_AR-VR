<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindAR-Zielbilder kompilieren</title><style>body{font:16px Arial;max-width:700px;margin:40px auto;padding:20px;line-height:1.6}button,a{display:block;padding:15px;margin:20px 0}progress{width:100%}</style></head><body><h1>Vier Scanbilder kompilieren</h1><p>Entwicklungswerkzeug: erstellt aus den Bildern in <code>models.json</code> eine gemeinsame MindAR-Erkennungsdatei. Reihenfolge und Zielindex bleiben erhalten. Die Berechnung erfolgt im Browser; die Bibliothek wird von jsDelivr geladen.</p><button id="compile" disabled>Compiler wird geladen …</button><progress id="progress" max="100" value="0"></progress><p id="status" role="status">Warten …</p><a id="download" hidden download="targets.mind">targets.mind herunterladen</a><script type="module">
import {Compiler} from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';
const button=document.querySelector('#compile'),status=document.querySelector('#status');
button.disabled=false;button.textContent='Alle vier Bilder kompilieren';
button.addEventListener('click',async()=>{button.disabled=true;try{const models=await fetch('../models.json').then(r=>r.json());const images=await Promise.all(models.map(async m=>{const image=new Image();image.src='../'+m.target;await image.decode();return image;}));const compiler=new Compiler();window.compiler=compiler;status.textContent='Merkmale werden berechnet …';const data=await compiler.compileImageTargets(images,p=>{document.querySelector('#progress').value=p;});const buffer=await compiler.exportData();const a=document.querySelector('#download');a.href=URL.createObjectURL(new Blob([buffer]));a.hidden=false;window.compileResult={count:data.length,bytes:buffer.byteLength};status.textContent=`Fertig: ${data.length} Zielbilder, ${buffer.byteLength} Bytes`;document.querySelector('#progress').value=100;}catch(e){status.textContent='Fehler: '+e.message;console.error(e);}finally{button.disabled=false;}});
</script><link rel="icon" href="../favicon.svg"></body></html>
